name: Analyze Business Rules

on:
  workflow_dispatch:  # Manual trigger — runs full analysis across all modules
  push:
    paths:
      - 'NXCLOUD/rpgsrc/**/*.MBR'
      - 'NXKORR/rpgsrc/**/*.MBR'

jobs:
  analyze-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # On push: detect which .MBR files changed for targeted analysis
      - name: Detect changed RPG files (push only)
        if: github.event_name == 'push'
        id: detect
        run: |
          set -euo pipefail
          FILES=$(git diff --name-only HEAD~1 HEAD -- '*.MBR' | tr '\n' ' ' | xargs)
          if [ -z "$FILES" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No .MBR files changed — skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "files=$FILES" >> $GITHUB_OUTPUT
            echo "Changed RPG files: $FILES"
          fi

      # Targeted analysis: Claude reads the changed files, identifies the module,
      # and updates only the relevant business rules doc(s) in docs/.
      - name: Analyze changed files and update relevant docs (push)
        if: github.event_name == 'push' && steps.detect.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          CHANGED_FILES="${{ steps.detect.outputs.files }}"

          claude -p "
          The following RPG source files have been modified:
          $CHANGED_FILES

          Your task:
          1. Read and analyze each changed file to understand what business process it implements.

          2. Identify which business module it belongs to by examining:
             - The database files (PF/LF) it reads and writes
             - The subprograms it calls and any programs that call it
             - Other programs in the same directory with the same prefix

          3. Find the correct existing business rules document in docs/ to update:
             - Run: ls docs/*-business-rules.md to see all existing docs
             - Pick the most relevant existing file and UPDATE it in place
             - STRICT NAMING RULE: filenames must follow the pattern docs/<module>-business-rules.md
               e.g. docs/invoice-business-rules.md NOT docs/business-rules-invoice-processing.md
             - Only create a new file if absolutely no relevant doc exists

          4. Write the FULL document content — never use placeholders like
             '*(content as written above)*' or '*(same as above)*'.
             Every section must contain the actual extracted rules, not references to other sections.

          5. Update ONLY the doc(s) for the affected module(s). Do not modify unrelated docs.

          6. Follow the document format in .github/prompts/business-rules-prompt.txt exactly.
             Focus on conditions that BLOCK or PREVENT the business operation.
             Use DB2 TABLE.COLUMN notation for all field references.
          " \
            --model claude-sonnet-4-6 \
            --dangerously-skip-permissions \
            --output-format text

      # Full analysis: Claude agent reads the prompt and writes all module docs directly to docs/
      - name: Analyze all business rules (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          claude -p "
          Read .github/prompts/business-rules-prompt.txt for the full list of modules,
          programs, primary tables, and document format.

          The prompt defines 69 modules. You must produce all 69 documents — do not stop early.

          For each module listed in the prompt:
          1. Read and analyze the listed RPG source files from the codebase
          2. Write the complete business rules document DIRECTLY to the output file
             specified in the prompt (e.g. docs/invoice-business-rules.md)
          3. Follow the STANDARD DOCUMENT FORMAT exactly as defined in the prompt
          4. Write the FULL content for every section — never use placeholders like
             '*(content as written above)*' or references to other sections
          5. STRICT NAMING RULE: filenames must follow docs/<module>-business-rules.md
             e.g. docs/invoice-business-rules.md NOT docs/business-rules-invoice.md

          Do NOT print document content to stdout.
          Write each document directly to its file in docs/.
          After writing all 69 files, print a single summary line: 'Done: N documents written.'
          " \
            --model claude-sonnet-4-6 \
            --dangerously-skip-permissions \
            --max-turns 500 \
            --output-format text

      - name: Check for changes
        id: check-changes
        run: |
          MODIFIED=$(git diff --name-only -- docs/)
          UNTRACKED=$(git ls-files --others --exclude-standard docs/)
          ALL_CHANGED=$(echo -e "$MODIFIED\n$UNTRACKED" | grep -v '^$' || true)
          if [ -z "$ALL_CHANGED" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in docs/"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "changed_docs<<EOF" >> $GITHUB_OUTPUT
            echo "$ALL_CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "Changed docs: $ALL_CHANGED"
          fi

      # Build a markdown table of changed docs for the PR body
      - name: Build changed files table
        if: steps.check-changes.outputs.changes == 'true'
        id: build-table
        run: |
          python3 << 'PYEOF'
          import os

          changed = """${{ steps.check-changes.outputs.changed_docs }}""".strip().splitlines()

          rows = []
          for f in changed:
              f = f.strip()
              if not f:
                  continue
              # Derive a readable module name from the filename
              # e.g. docs/invoice-business-rules.md -> Invoice Business Rules
              basename = os.path.basename(f).replace('.md', '').replace('-', ' ').title()
              rows.append(f'| `{f}` | {basename} |')

          table = "| File | Module |\n|------|--------|\n" + "\n".join(rows)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write("table<<EOF\n")
              out.write(table + "\n")
              out.write("EOF\n")
          PYEOF

      - name: Create Pull Request
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: Update business rules documentation"
          branch: docs/business-rules-update
          delete-branch: true
          title: "Update Business Rules Documentation"
          body: |
            ## Automated Business Rules Update

            This PR was automatically generated by Claude Code analysis of the RPG codebase.

            **Trigger:** `${{ github.event_name }}`
            ${{ github.event_name == 'push' && format('**Changed RPG files:** `{0}`', steps.detect.outputs.files) || '**Scope:** Full analysis across all modules' }}

            ### Files Updated
            ${{ steps.build-table.outputs.table }}

            ### Document Structure (consistent across all files)
            - **Prerequisites / Master Data Requirements**
            - **Validation Rules**
            - **Configuration and Authorization Rules**
            - **Financial / Transactional Rules**
            - **Status and Lifecycle Rules**
            - **Special Conditions (Program-Specific)**
            - **Subprogram Calls Affecting Logic**
            - **Reference Tables**

            ### Review Checklist
            - [ ] Review extracted business rules for accuracy
            - [ ] Verify DB2 table/column references are correct
            - [ ] Check for any sensitive information that should be redacted
          labels: |
            documentation
            automated
