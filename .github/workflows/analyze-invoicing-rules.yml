name: Analyze Business Rules

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  analyze-rules:
    runs-on: ubuntu-latest
    # Defines the default `GITHUB_TOKEN` access level for all jobs in this workflow.
    # Use least-privilege permissions (for example, `contents: read`) and elevate
    # only where specific jobs require additional scopes (such as `pull-requests: write`).
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Analyze all business rules
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          claude -p "$(cat .github/prompts/business-rules-prompt.txt)" \
            --model claude-sonnet-4-6 \
            --dangerously-skip-permissions \
            --output-format text > /tmp/all-business-rules.md

      - name: Split output into individual rule files
        run: |
          set -euo pipefail
          mkdir -p docs
          python3 << 'PYEOF'
          import re, os, sys

          with open('/tmp/all-business-rules.md', 'r', encoding='utf-8') as f:
              content = f.read()

          # Split on ===FILE:docs/filename=== delimiter
          parts = re.split(r'={3}FILE:(docs/[^\s=]+)={3}', content)

          if len(parts) < 3:
              print("ERROR: No ===FILE:=== delimiters found in Claude output.")
              print("First 500 chars:", content[:500])
              sys.exit(1)

          expected_files = [
              'docs/invoice-business-rules.md',
              'docs/sales-order-business-rules.md',
              'docs/customer-ar-business-rules.md',
              'docs/item-product-business-rules.md',
              'docs/item-product-maintenance-rules.md',
          ]
          written = []

          for i in range(1, len(parts), 2):
              filename = parts[i].strip()
              doc = parts[i + 1].strip() if i + 1 < len(parts) else ''
              os.makedirs(os.path.dirname(filename), exist_ok=True)
              with open(filename, 'w', encoding='utf-8') as f:
                  f.write(doc + '\n')
              written.append(filename)
              print(f'Written: {filename} ({len(doc):,} chars)')

          missing = [f for f in expected_files if f not in written]
          if missing:
              print(f'ERROR: Missing documents: {missing}')
              sys.exit(1)

          print(f'All {len(written)} documents written successfully.')
          PYEOF

      - name: Cleanup extra files
        run: |
          rm -f invoice*.md sales*.md purchase*.md customer*.md
          echo "Cleaned up extra files"

      - name: Check for changes
        id: check-changes
        run: |
          MODIFIED=$(git diff --name-only -- docs/)
          UNTRACKED=$(git ls-files --others --exclude-standard docs/)
          if [ -z "$MODIFIED" ] && [ -z "$UNTRACKED" ]; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in any business rules files"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            [ -n "$MODIFIED"  ] && echo "Modified:  $MODIFIED"
            [ -n "$UNTRACKED" ] && echo "New files: $UNTRACKED"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: Update business rules documentation"
          branch: docs/business-rules-update
          delete-branch: true
          title: "Update Business Rules Documentation"
          body: |
            ## Automated Business Rules Update

            This PR was automatically generated by Claude Code analysis of the RPG codebase.

            ### Files Updated
            | File | Module | Programs |
            |------|--------|----------|
            | `docs/invoice-business-rules.md` | Invoice Processing | FO616R, FO615R |
            | `docs/sales-order-business-rules.md` | Sales Order Management | FO100R, FO500R, FO614R, FO730R |
            | `docs/customer-ar-business-rules.md` | Customer and Accounts Receivable | RK*, RE*, AR* programs |
            | `docs/item-product-business-rules.md` | Item and Product Maintenance (VV) | VV*, VP* programs |
            | `docs/item-product-maintenance-rules.md` | JV Item and Product Maintenance | JV* programs |

            ### Document Structure (consistent across all files)
            - **Prerequisites / Master Data Requirements**
            - **Validation Rules**
            - **Configuration and Authorization Rules**
            - **Financial / Transactional Rules**
            - **Status and Lifecycle Rules**
            - **Special Conditions (Program-Specific)**
            - **Subprogram Calls Affecting Logic**
            - **Reference Tables**

            ### Review Checklist
            - [ ] Review extracted business rules for accuracy
            - [ ] Verify DB2 table/column references are correct
            - [ ] Check for any sensitive information that should be redacted
          labels: |
            documentation
            automated
